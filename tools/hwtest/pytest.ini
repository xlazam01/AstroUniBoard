[pytest]
testpaths = .
markers =
    motion: moves a motor (focuser or rotator) by a small amount and back
    eeprom: writes the EEPROM (:23#) and reboots the board
    sht_external: needs the external SHT31 on J9
    sht_onboard: needs the on-board SHT31 (not fitted on the rev 1 test board)
    imu: needs the MPU-6000 IMU
