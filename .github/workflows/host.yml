name: Host software

on:
  push:
    branches: [main]
    paths: ["driver/ASCOM/**", ".github/workflows/host.yml"]
  pull_request:
    paths: ["driver/ASCOM/**", ".github/workflows/host.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: AstroUniBoard.Core tests (net48)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        working-directory: driver/ASCOM
        run: dotnet test AstroUniBoard.Core.Tests/AstroUniBoard.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: driver/ASCOM/**/TestResults/*.trx
