name: sim

# Device simulator (driver/sim, #39): its own tests on Linux (pty + TCP) and Windows (TCP),
# the two places the host tests that use it run.
on:
  push:
    branches: [main]
    paths: ["driver/sim/**", ".github/workflows/sim.yml"]
  pull_request:
    paths: ["driver/sim/**", ".github/workflows/sim.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: driver/sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -v
