; AstroUniBoard firmware V2 (HW rev 2.0 only; rev 1 boards run fw-onstepx/).
; Plan: docs/V2_PLAN.md

[platformio]
default_envs = rev2

[env:rev2]
platform = ststm32
board = nucleo_g0b1re
framework = arduino
upload_protocol = dfu
; STM32G0B1CBT6: 128 KB flash (the nucleo board profile assumes the 512 KB part)
board_upload.maximum_size = 131072
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    ; pid.codes VID 0x1209. PID 0x0001 is the shared TEST pid until AstroUniBoard has its own.
    -D USBD_VID=0x1209
    -D USBD_PID=0x0001
    -D USB_MANUFACTURER_STRING="\"AstroUniBoard\""
    -D USB_PRODUCT_STRING="\"AstroUniBoard Focuser Rotator\""
    -D HAL_PCD_MODULE_ENABLED
    -D HSE_VALUE=8000000

; Host unit tests for pure logic (no Arduino): pio test -e native
; Needs a host gcc on PATH (MinGW on Windows). Add pure .cpp files to build_src_filter.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<rotator_wrap.cpp> +<rotator_calc.cpp> +<imu_math.cpp>
build_flags = -std=gnu++17
